[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
auto_detect_solc = false
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
# Scoped to two scratch files: TenderInvariantsTest.afterInvariant() appends a CSV line
# per run (console.log alone only surfaces the last run's output), so the agent driving
# the suite can compute the phase-reach distribution across all runs afterward. Test-only
# diagnostics; nothing under src/ reads or writes this. DemoConstants (Step 8) hands
# deployed addresses from DeployLocal.s.sol to the script/demo/*.s.sol stage scripts
# (separate `forge script` processes) through the second file.
fs_permissions = [
  { access = "read-write", path = "./test/invariant/.phase-reach-log.csv" },
  { access = "read-write", path = "./script/demo/.demo-state.json" },
]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64
fail_on_revert = false

[fmt]
line_length = 100

[lint]
# We keep readable getter names (t.pe(), t.registry()) for immutables.
exclude_lints = ["screaming-snake-case-immutable", "mixed-case-variable", "mixed-case-function"]
